<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de usuario</title>
</head>

<body>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <h1>Registro de usuario</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Registrarse
        </button>

    </form>

    <br>

    <a href="{% url 'list' %}">
        Volver a productos
    </a>

</body>
</html>
